
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Shop Startup Toolkit</title>
  <style>
    body {
      margin: 0;
      background: #f7f4ef;
      color: #29231f;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 680px;
      margin: 70px auto;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 6px 24px #0000000a;
    }
    .eyebrow {
      color: #927354;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: bold;
    }
    h1 { font-size: 36px; line-height: 1.15; }
    p { line-height: 1.7; }
    button {
      background: #34271e;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 16px 24px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #654831; }
    @media (max-width: 600px) {
      main { margin: 24px auto; }
      .card { padding: 24px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p class="eyebrow">COFFEE BUSINESS TOOLKIT</p>
      <h1>Are You Ready to Open Your Coffee Shop?</h1>
      <p>
        Discover how prepared you are, identify gaps
        in your planning, and find out what to focus
        on before making your next big investment.
      </p>
      <p>
        Built around the practical coffee business
        experience of Bellissimo Coffee Advisors.
      </p>
      <button type="button" disabled>
        Assessment Coming Soon
      </button>
    </div>
  </main>
</body>
</html>
